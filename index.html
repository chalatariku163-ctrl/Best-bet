<body>

<header>

  <div class="logo">
    🎯 BEST BET
  </div>

  <div class="sub">
    Football • Today → Next 7 Days • Multiple Markets
  </div>

</header>


<nav>

  <button
    id="tabMatches"
    class="active"
    onclick="tab('matches',this)"
  >
    📅<br>
    Matches
  </button>

  <button
    onclick="tab('best',this)"
  >
    🎯<br>
    Best Bet
  </button>

  <button
    onclick="tab('live',this)"
  >
    🔴<br>
    Live
  </button>

  <button
    onclick="tab('slip',this)"
  >
    🎟️<br>
    Bet Slip
  </button>

</nav>


<main>

<section
  id="content"
  class="panel"
>

  <div class="loader">
    ⏳ Loading football matches...
  </div>

</section>

</main>


<script>

let matches = [];

let slip = JSON.parse(
  localStorage.getItem(
    "bestbet_slip"
  ) || "[]"
);


/* ========================================================
   ESCAPE HTML
======================================================== */

function esc(x){

  return String(
    x ?? ""
  ).replace(
    /[&<>"']/g,
    function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m];

    }
  );

}


/* ========================================================
   SAVE SLIP
======================================================== */

function saveSlip(){

  localStorage.setItem(
    "bestbet_slip",
    JSON.stringify(slip)
  );

}


/* ========================================================
   API
   Important:
   Never blindly call response.json()
======================================================== */

async function api(path){

  const response =
    await fetch(
      path,
      {
        method:"GET",

        headers:{
          "Accept":
            "application/json"
        },

        cache:"no-store"
      }
    );


  const contentType =
    response.headers.get(
      "content-type"
    ) || "";


  const raw =
    await response.text();


  if(
    contentType.includes(
      "application/json"
    )
  ){

    let data;

    try{

      data =
        JSON.parse(raw);

    }catch(error){

      throw new Error(
        "Server JSON sirrii hin deebifne."
      );

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        data.message ||
        `Server error ${response.status}`
      );

    }

    return data;

  }


  if(
    raw.trim()
      .startsWith("<!")
    ||
    raw.trim()
      .startsWith("<html")
    ||
    raw.trim()
      .startsWith("<HTML")
  ){

    throw new Error(
      "API endpoint HTML deebise.\n\n" +
      "Path: " + path + "\n" +
      "HTTP: " + response.status + "\n\n" +
      "Flask route ykn Render deployment ilaali."
    );

  }


  throw new Error(
    "Response hin beekamne. HTTP " +
    response.status
  );

}


/* ========================================================
   TAB
======================================================== */

function tab(
  name,
  btn
){

  document
    .querySelectorAll(
      "nav button"
    )
    .forEach(
      x =>
        x.classList.remove(
          "active"
        )
    );


  btn.classList.add(
    "active"
  );


  if(
    name === "matches"
  ){
    loadMatches();
  }

  if(
    name === "best"
  ){
    loadBest();
  }

  if(
    name === "live"
  ){
    loadLive();
  }

  if(
    name === "slip"
  ){
    renderSlip();
  }

}


/* ========================================================
   DATE KEY
======================================================== */

function dateKey(date){

  const d =
    new Date(date);

  return (
    d.getFullYear() +
    "-" +
    String(
      d.getMonth()+1
    ).padStart(2,"0") +
    "-" +
    String(
      d.getDate()
    ).padStart(2,"0")
  );

}


/* ========================================================
   DATE LABEL
======================================================== */

function dateLabel(date){

  const d =
    new Date(date);

  const now =
    new Date();

  const tomorrow =
    new Date();

  tomorrow.setDate(
    tomorrow.getDate()+1
  );


  const key =
    dateKey(d);

  const todayKey =
    dateKey(now);

  const tomorrowKey =
    dateKey(tomorrow);


  if(
    key === todayKey
  ){
    return "TODAY";
  }


  if(
    key === tomorrowKey
  ){
    return "TOMORROW";
  }


  return d.toLocaleDateString(
    undefined,
    {
      weekday:"short",
      day:"numeric",
      month:"short"
    }
  );

}


/* ========================================================
   LOAD MATCHES
======================================================== */

function loadMatches(){

  const c =
    document.getElementById(
      "content"
    );


  c.innerHTML = `
    <div class="loader">
      ⏳ Loading football matches...
    </div>
  `;


  api(
    "/api/matches"
  )

  .then(
    function(data){

      matches =
        data.matches || [];


      if(
        !matches.length
      ){

        c.innerHTML = `
          <h2>⚽ Football</h2>

          <div class="empty">

            No football matches
            with available odds found.

            <br><br>

            <span class="status">
              ${esc(
                data.message || ""
              )}
            </span>

            <button
              class="refresh"
              onclick="forceRefresh()"
            >
              🔄 Refresh
            </button>

          </div>
        `;

        return;

      }


      renderDayTabs();

    }
  )

  .catch(
    function(error){

      c.innerHTML = `
        <h2>⚠️ Error</h2>

        <div class="error">
          ${esc(
            error.message
          )}
        </div>

        <button
          class="big"
          onclick="forceRefresh()"
        >
          🔄 Try Again
        </button>
      `;

    }
  );

}


/* ========================================================
   FORCE REFRESH
======================================================== */

function forceRefresh(){

  const c =
    document.getElementById(
      "content"
    );

  c.innerHTML = `
    <div class="loader">
      🔄 Refreshing football matches...
    </div>
  `;


  api(
    "/api/matches?refresh=1"
  )

  .then(
    function(data){

      matches =
        data.matches || [];


      if(
        !matches.length
      ){

        c.innerHTML = `
          <h2>⚽ Football</h2>

          <div class="empty">

            No football matches
            with available odds found.

            <br><br>

            ${esc(
              data.message || ""
            )}

          </div>
        `;

        return;

      }


      renderDayTabs();

    }
  )

  .catch(
    function(error){

      c.innerHTML = `
        <h2>⚠️ Error</h2>

        <div class="error">
          ${esc(
            error.message
          )}
        </div>
      `;

    }
  );

}


/* ========================================================
   DAY TABS
======================================================== */

function renderDayTabs(){

  const c =
    document.getElementById(
      "content"
    );


  const groups = {};


  matches.forEach(
    function(m){

      if(
        !m.commence_time
      ){
        return;
      }


      const key =
        dateKey(
          m.commence_time
        );


      if(
        !groups[key]
      ){
        groups[key] = [];
      }


      groups[key].push(m);

    }
  );


  const keys =
    Object.keys(
      groups
    ).sort();


  if(
    !keys.length
  ){

    c.innerHTML = `
      <div class="empty">
        No matches found.
      </div>
    `;

    return;

  }


  let html = `

    <h2>
      ⚽ Football Matches
    </h2>

    <div class="status">
      Today → Next 7 Days •
      ${matches.length} matches
    </div>

    <button
      class="refresh"
      onclick="forceRefresh()"
    >
      🔄 Refresh Odds
    </button>

    <div class="days">
  `;


  keys.forEach(
    function(key,index){

      html += `
        <button
          class="${index===0
            ? "active"
            : ""}"
          onclick="showDay(
            '${key}',
            this
          )"
        >

          ${esc(
            dateLabel(
              key +
              "T12:00:00"
            )
          )}

          <br>

          <small>
            ${groups[key].length}
            matches
          </small>

        </button>
      `;

    }
  );


  html += `
    </div>

    <div id="dayMatches"></div>
  `;


  c.innerHTML =
    html;


  showDay(
    keys[0],
    document.querySelector(
      ".days button"
    )
  );

}


/* ========================================================
   SHOW DAY
======================================================== */

function showDay(
  key,
  btn
){

  document
    .querySelectorAll(
      ".days button"
    )
    .forEach(
      x =>
        x.classList.remove(
          "active"
        )
    );


  if(btn){

    btn.classList.add(
      "active"
    );

  }


  const list =
    matches.filter(
      function(m){

        return (
          dateKey(
            m.commence_time
          ) === key
        );

      }
    );


  const box =
    document.getElementById(
      "dayMatches"
    );


  if(!box){
    return;
  }


  let html = `

    <div class="day-title">

      ${esc(
        dateLabel(
          key +
          "T12:00:00"
        )
      )}

    </div>
  `;


  if(
    !list.length
  ){

    html += `
      <div class="empty">
        No matches.
      </div>
    `;

  }else{

    html +=
      list
        .map(
          renderMatch
        )
        .join("");

  }


  box.innerHTML =
    html;

}


/* ========================================================
   SELECTED
======================================================== */

function isSelected(
  id,
  betId,
  selection
){

  return slip.some(
    function(x){

      return (
        String(x.id)
        === String(id)

        &&
        
        String(x.betId)
        === String(betId)

        &&

        String(x.selection)
        === String(selection)
      );

    }
  );

}


/* ========================================================
   ODD BUTTON
======================================================== */

function oddButton(
  m,
  label,
  odd
){

  if(
    odd == null
    ||
    Number(odd) <= 1
  ){

    return `
      <div class="odd">

        ${esc(label)}

        <b>-</b>

      </div>
    `;

  }


  const selected =
    isSelected(
      m.id,
      "h2h",
      label
    );


  const bet = {

    id:m.id,

    home:m.home,

    away:m.away,

    league:m.league,

    market:"1X2",

    selection:label,

    odd:Number(odd),

    betId:"h2h"

  };


  return `
    <div
      class="odd ${
        selected
          ? "selected"
          : ""
      }"
      onclick='selectBet(
        ${JSON.stringify(
          bet
        )}
      )'
    >

      ${esc(label)}

      <b>
        ${Number(odd)
          .toFixed(2)}
      </b>

    </div>
  `;

}


/* ========================================================
   MARKET CHIP
======================================================== */

function chip(
  label,
  odd
){

  if(
    odd == null
    ||
    Number(odd) <= 1
  ){

    return `
      <div class="market-chip">
        ${esc(label)}:
        <b>-</b>
      </div>
    `;

  }


  return `
    <div class="market-chip">

      ${esc(label)}:

      <b>
        ${Number(odd)
          .toFixed(2)}
      </b>

    </div>
  `;

}


/* ========================================================
   RENDER MATCH
======================================================== */

function renderMatch(m){

  const h =
    m.h2h || {};

  const t =
    m.totals || {};

  const b =
    m.btts || {};


  return `

    <div class="match">

      <div class="teams">

        ${esc(m.home)}

        <span class="vs">
          vs
        </span>

        ${esc(m.away)}

      </div>


      <div class="meta">

        🏆
        ${esc(
          m.league ||
          "Football"
        )}

        •

        🕐
        ${esc(
          m.time || ""
        )}

      </div>


      <div class="odds">

        ${oddButton(
          m,
          "1",
          h.home
        )}

        ${oddButton(
          m,
          "X",
          h.draw
        )}

        ${oddButton(
          m,
          "2",
          h.away
        )}

      </div>


      <div class="market-row">

        ${chip(
          "O2.5",
          t.over
        )}

        ${chip(
          "U2.5",
          t.under
        )}

        ${chip(
          "BTTS Yes",
          b.yes
        )}

        ${chip(
          "BTTS No",
          b.no
        )}

      </div>


      <button
        class="big back"
        onclick="openMatch(
          '${esc(m.id)}'
        )"
      >

        📊 View All Markets

      </button>

    </div>

  `;

}


/* ========================================================
   SELECT BET
======================================================== */

function selectBet(
  bet
){

  if(
    !bet.odd
    ||
    Number(bet.odd) <= 1
  ){

    alert(
      "Odd is not available."
    );

    return;

  }


  /*
   * One selection from same market
   * replaces previous selection.
   */

  slip =
    slip.filter(
      function(x){

        return !(
          String(x.id)
          === String(bet.id)

          &&

          String(x.betId)
          === String(bet.betId)
        );

      }
    );


  slip.push(
    bet
  );


  saveSlip();


  openMatch(
    String(bet.id)
  );

}


/* ========================================================
   MARKET BUTTON
======================================================== */

function marketButton(
  m,
  market,
  selection,
  odd,
  betId
){

  if(
    odd == null
    ||
    Number(odd) <= 1
  ){
    return "";
  }


  const selected =
    isSelected(
      m.id,
      betId,
      selection
    );


  const bet = {

    id:m.id,

    home:m.home,

    away:m.away,

    league:m.league,

    market:market,

    selection:selection,

    odd:Number(odd),

    betId:String(betId)

  };


  return `

    <button
      class="selection ${
        selected
          ? "selected"
          : ""
      }"

      onclick='selectBet(
        ${JSON.stringify(
          bet
        )}
      )'
    >

      <span>
        ${esc(selection)}
      </span>

      <b>
        @
        ${Number(odd)
          .toFixed(2)}
      </b>

    </button>

  `;

}


/* ========================================================
   OPEN MATCH
======================================================== */

function openMatch(
  id
){

  const c =
    document.getElementById(
      "content"
    );


  c.innerHTML = `

    <div class="loader">
      ⏳ Loading all markets...
    </div>

  `;


  api(
    "/api/match/" +
    encodeURIComponent(id)
  )

  .then(
    function(data){

      const m =
        data.match;

      const markets =
        data.markets || [];


      let html = `

        <button
          class="big back"
          onclick="loadMatches()"
        >
          ⬅️ Back to Matches
        </button>


        <h2>

          ⚽
          ${esc(m.home)}

          vs

          ${esc(m.away)}

        </h2>


        <div class="meta">

          🏆
          ${esc(m.league)}

          •

          🕐
          ${esc(m.time || "")}

        </div>

      `;


      /* BEST BET */

      if(
        data.best_bet
      ){

        html += `

          <div
            class="market best-card"
          >

            <div
              class="market-title"
            >
              🎯 Best Bet
            </div>


            <div
              style="padding:13px"
            >

              <div
                class="yellow"
              >

                <b>
                  ${esc(
                    data.best_bet
                      .selection
                  )}
                </b>

                @

                ${
                  Number(
                    data.best_bet
                      .odd
                  ).toFixed(2)
                }

              </div>

            </div>

          </div>

        `;

      }


      /* MARKETS */

      if(
        !markets.length
      ){

        html += `

          <div class="market">

            <div
              class="market-title"
            >
              ⚠️ Markets
            </div>

            <div
              style="padding:13px"
              class="error"
            >

              ${esc(
                data.odds_error ||
                "No markets available."
              )}

            </div>

          </div>

        `;

      }


      markets.forEach(
        function(market){

          html += `

            <div class="market">

              <div
                class="market-title"
              >

                ${esc(
                  market.name
                )}

              </div>


              <div
                class="market-grid"
              >

                ${
                  (
                    market.selections
                    || []
                  )
                  .map(
                    function(s){

                      return marketButton(
                        m,
                        market.name,
                        s.value,
                        s.odd,
                        market.id
                      );

                    }
                  )
                  .join("")
                }

              </div>

            </div>

          `;

        }
      );


      html += `

        <button
          class="big"
          onclick="renderSlip()"
        >

          🎟️ Bet Slip
          (${slip.length})

        </button>

      `;


      c.innerHTML =
        html;

    }
  )

  .catch(
    function(error){

      c.innerHTML = `

        <button
          class="big back"
          onclick="loadMatches()"
        >
          ⬅️ Back
        </button>


        <h2>
          ⚠️ Error
        </h2>


        <div class="error">
          ${esc(
            error.message
          )}
        </div>

      `;

    }
  );

}

/* ========================================================
   BET SLIP
======================================================== */

function renderSlip(){

  const c =
    document.getElementById(
      "content"
    );


  if(
    !slip.length
  ){

    c.innerHTML = `

      <h2>
        🎟️ Bet Slip
      </h2>

      <div class="empty">

        Your Bet Slip is empty.

        <br><br>

        ⚽ Match keessaa
        selection filadhu.

      </div>

    `;

    return;

  }


  let total = 1;


  let html = `

    <h2>
      🎟️ Bet Slip
    </h2>

  `;


  slip.forEach(
    function(x,i){

      total *=
        Number(x.odd);


      html += `

        <div
          class="slip-item"
        >

          <b>

            ${i+1}.

            ${esc(x.home)}

            vs

            ${esc(x.away)}

          </b>


          <div class="meta">

            🏆
            ${esc(
              x.league ||
              ""
            )}

          </div>


          <div>

            📊
            ${esc(
              x.market
            )}

          </div>


          <div
            class="yellow"
          >

            🎯
            ${esc(
              x.selection
            )}

            @

            ${
              Number(
                x.odd
              ).toFixed(2)
            }

          </div>


          <button
            class="big back"
            onclick="removeBet(${i})"
          >

            🗑 Remove

          </button>

        </div>

      `;

    }
  );


  html += `

    <div class="market">

      <div
        class="market-title"
      >

        📈 Total Odds:
        ${total.toFixed(2)}

      </div>

    </div>


    <button
      class="big"
      onclick="clearSlip()"
    >

      🗑 Clear Bet Slip

    </button>

  `;


  c.innerHTML =
    html;

}


/* ========================================================
   REMOVE BET
======================================================== */

function removeBet(i){

  slip.splice(
    i,
    1
  );

  saveSlip();

  renderSlip();

}


/* ========================================================
   CLEAR SLIP
======================================================== */

function clearSlip(){

  slip = [];

  saveSlip();

  renderSlip();

}


/* ========================================================
   START
======================================================== */

loadMatches();

</script>

 </html>
