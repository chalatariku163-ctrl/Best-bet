<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEST BET CASINO</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#081426;color:#f4f7ff;font:16px system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:18px}.brand{text-align:center;font-size:25px;font-weight:900;color:#ffd400;margin:12px 0}
.pill,.panel{background:#11233b;border:1px solid #243b5b;border-radius:16px;padding:15px;margin:12px 0}
.balance{font-size:25px;color:#9be15d;font-weight:800}.games{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button,select,input{font:inherit;border-radius:12px;border:1px solid #385477;padding:12px;background:#182e4c;color:white}
button{cursor:pointer;font-weight:750}.game{min-height:90px}.game.active{background:#234a39;border-color:#9be15d}
label{display:block;margin:10px 0 5px;color:#c9d6e9}.primary{width:100%;background:#ffd400;color:#172238;border:0;margin-top:12px}
#result{font-size:19px;text-align:center;min-height:48px;margin:14px 0;overflow-wrap:anywhere}
small{color:#b5c5db}.history{font-size:13px;line-height:1.7;overflow-wrap:anywhere}
</style></head><body><main>
<div class="brand">🎰 BEST BET CASINO</div>
<div class="pill">Demo balance<br><span class="balance" id="balance">Loading…</span> <small>points</small></div>
<div class="panel"><b>Choose a game</b><div class="games" style="margin-top:10px">
<button class="game active" data-game="slots">🎰<br>Slots</button>
<button class="game" data-game="blackjack">🃏<br>Blackjack</button>
<button class="game" data-game="roulette">🎡<br>Roulette</button></div>
<label for="stake">Stake (1–100 demo points)</label><input id="stake" type="number" min="1" max="100" value="10" style="width:100%">
<div id="roulettePick" hidden><label>Pick a color</label><select id="pick" style="width:100%"><option value="red">Red</option><option value="black">Black</option><option value="green">Green (0)</option></select></div>
<button class="primary" id="play">PLAY</button><div id="result"></div>
<small>Demo game for entertainment. No real money, deposits, or withdrawals.</small></div>
<div class="panel"><b>Recent game history</b><div id="history" class="history">Loading…</div></div>
</main><script>
const tg=window.Telegram?.WebApp; tg?.ready();tg?.expand();
let selected="slots";
const headers={"Content-Type":"application/json","X-Telegram-Init-Data":tg?.initData||""};
const money=n=>Number(n).toLocaleString();
function setGame(g){selected=g;document.querySelectorAll(".game").forEach(b=>b.classList.toggle("active",b.dataset.game===g));document.querySelector("#roulettePick").hidden=g!=="roulette";document.querySelector("#result").textContent="";}
document.querySelectorAll(".game").forEach(b=>b.onclick=()=>setGame(b.dataset.game));
async function refresh(){try{const r=await fetch("/api/me",{headers});const d=await r.json();if(!r.ok)throw Error(d.error);document.querySelector("#balance").textContent=money(d.balance);document.querySelector("#history").innerHTML=d.history.length?d.history.map(x=>`${x.created.slice(0,16).replace("T"," ")} · ${x.game} · stake ${x.stake} · payout ${x.payout}<br>`).join(""):"No games yet";}catch(e){document.querySelector("#balance").textContent="—";document.querySelector("#history").textContent=e.message+" Please open this from your Telegram bot."}}
document.querySelector("#play").onclick=async()=>{const btn=document.querySelector("#play");const stake=Number(document.querySelector("#stake").value);if(!Number.isInteger(stake)||stake<1||stake>100){document.querySelector("#result").textContent="Enter a stake from 1 to 100.";return}btn.disabled=true;try{const payload={game:selected,stake,pick:document.querySelector("#pick").value};const r=await fetch("/api/play",{method:"POST",headers,body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error);document.querySelector("#result").textContent=`${d.result} · payout ${d.payout} · ${d.net>=0?"+":""}${d.net} points`;tg?.HapticFeedback?.notificationOccurred(d.net>0?"success":"warning");await refresh()}catch(e){document.querySelector("#result").textContent=e.message}finally{btn.disabled=false}};
refresh();
</script></body></html>
