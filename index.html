<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Best Bet - Keno Fast</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top,
                    #253b70 0%,
                    #10182f 45%,
                    #080c19 100%
                );
            color: white;
            padding: 16px;
        }

        .app {
            width: 100%;
            max-width: 520px;
            margin: auto;
        }

        .header {
            text-align: center;
            padding: 18px 10px;
        }

        .logo {
            font-size: 34px;
            font-weight: 900;
        }

        .subtitle {
            margin-top: 6px;
            opacity: 0.75;
            font-size: 14px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            padding: 18px;
            backdrop-filter: blur(12px);
            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.35);
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .title {
            font-size: 22px;
            font-weight: 800;
        }

        .timer {
            min-width: 65px;
            text-align: center;
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            font-weight: 800;
        }

        .result-box {
            min-height: 110px;
            border-radius: 18px;
            background: rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            margin-bottom: 18px;
        }

        .result-numbers {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .result-number {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #111827;
            font-weight: 900;
            animation: pop 0.35s ease;
        }

        @keyframes pop {
            from {
                transform: scale(0.3);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .section-title {
            margin-bottom: 10px;
            font-size: 15px;
            opacity: 0.8;
        }

        .numbers {
            display: grid;
            grid-template-columns:
                repeat(10, 1fr);
            gap: 6px;
        }

        .number {
            aspect-ratio: 1 / 1;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.10);
            color: white;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.15s;
        }

        .number:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.18);
        }

        .number.selected {
            background: #ffffff;
            color: #10182f;
            transform: scale(1.05);
        }

        .number.drawn {
            outline: 2px solid white;
            transform: scale(1.05);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 18px;
        }

        button.action {
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
        }

        .draw {
            background: #ffffff;
            color: #10182f;
        }

        .clear {
            background: rgba(255, 255, 255, 0.10);
            color: white;
        }

        .selected-info {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.8;
        }

        .message {
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
            font-size: 13px;
        }

        .footer {
            text-align: center;
            padding: 18px;
            font-size: 12px;
            opacity: 0.55;
        }

        @media (max-width: 380px) {
            .numbers {
                gap: 4px;
            }

            .number {
                font-size: 12px;
                border-radius: 8px;
            }

            .result-number {
                width: 34px;
                height: 34px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">
            ⚡ KENO FAST
        </div>

        <div class="subtitle">
            Number Game Demo
        </div>
    </div>


    <div class="game-card">

        <div class="top-row">

            <div class="title">
                🎲 GAME
            </div>

            <div class="timer" id="timer">
                30s
            </div>

        </div>


        <div class="result-box">

            <div
                class="result-numbers"
                id="results"
            >
                <span
                    style="
                    opacity:0.5;
                    font-size:14px;
                    "
                >
                    Result asitti mul'ata
                </span>
            </div>

        </div>


        <div class="section-title">
            🔢 Lakkoofsa 1 - 80 keessaa filadhu
        </div>


        <div
            class="numbers"
            id="numbers"
        ></div>


        <div class="selected-info">

            Selected:
            <strong id="selectedCount">
                0
            </strong>

        </div>


        <div class="controls">

            <button
                class="action draw"
                onclick="drawNumbers()"
            >
                🎲 RANDOM DRAW
            </button>

            <button
                class="action clear"
                onclick="clearSelection()"
            >
                🗑️ CLEAR
            </button>

        </div>


        <div
            class="message"
            id="message"
        ></div>

    </div>


    <div class="footer">
        Demo game — no real money or payout.
    </div>

</div>


<script>

    const numbersContainer =
        document.getElementById("numbers");

    const resultsContainer =
        document.getElementById("results");

    const selectedCount =
        document.getElementById("selectedCount");

    const message =
        document.getElementById("message");

    const timerElement =
        document.getElementById("timer");


    let selectedNumbers = [];

    let timeLeft = 30;


    // =====================================================
    // CREATE NUMBERS
    // =====================================================

    for (let i = 1; i <= 80; i++) {

        const button =
            document.createElement("button");

        button.className = "number";

        button.textContent = i;

        button.dataset.number = i;

        button.onclick = function () {

            toggleNumber(i, button);

        };

        numbersContainer.appendChild(button);
    }


    // =====================================================
    // SELECT NUMBER
    // =====================================================

    function toggleNumber(
        number,
        button
    ) {

        if (
            selectedNumbers.includes(number)
        ) {

            selectedNumbers =
                selectedNumbers.filter(
                    n => n !== number
                );

            button.classList.remove(
                "selected"
            );

        } else {

            selectedNumbers.push(number);

            button.classList.add(
                "selected"
            );
        }

        selectedCount.textContent =
            selectedNumbers.length;

        message.textContent = "";
    }


    // =====================================================
    // CLEAR
    // =====================================================

    function clearSelection() {

        selectedNumbers = [];

        document
            .querySelectorAll(".number")
            .forEach(button => {

                button.classList.remove(
                    "selected"
                );

                button.classList.remove(
                    "drawn"
                );
            });

        selectedCount.textContent = "0";

        resultsContainer.innerHTML =
            `<span
                style="
                opacity:0.5;
                font-size:14px;
                "
            >
                Result asitti mul'ata
            </span>`;

        message.textContent = "";
    }


    // =====================================================
    // RANDOM DRAW
    // =====================================================

    function drawNumbers() {

        let pool = [];

        for (let i = 1; i <= 80; i++) {
            pool.push(i);
        }


        let results = [];


        while (results.length < 10) {

            const index =
                Math.floor(
                    Math.random() *
                    pool.length
                );

            results.push(
                pool.splice(index, 1)[0]
            );
        }


        results.sort(
            (a, b) => a - b
        );


        resultsContainer.innerHTML = "";


        results.forEach(number => {

            const result =
                document.createElement("div");

            result.className =
                "result-number";

            result.textContent =
                number;

            resultsContainer.appendChild(
                result
            );


            const numberButton =
                document.querySelector(
                    `.number[data-number="${number}"]`
                );

            if (numberButton) {

                numberButton.classList.add(
                    "drawn"
                );
            }

        });


        message.textContent =
            "🎲 Random result generated.";

        resetTimer();
    }


    // =====================================================
    // TIMER
    // =====================================================

    function resetTimer() {

        timeLeft = 30;

        timerElement.textContent =
            timeLeft + "s";
    }


    setInterval(() => {

        timeLeft--;

        if (timeLeft <= 0) {

            drawNumbers();

            timeLeft = 30;
        }

        timerElement.textContent =
            timeLeft + "s";

    }, 1000);

</script>

</body>
</html>
