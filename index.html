<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BEST BET - Football</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #243b6b 0%,
                    #10182f 42%,
                    #070b16 100%
                );
            color: white;
            min-height: 100vh;
            padding-bottom: 90px;
        }

        button {
            font-family: inherit;
        }

        .app {
            width: 100%;
            max-width: 560px;
            margin: auto;
        }

        /* ================= HEADER ================= */

        .header {
            padding: 20px 16px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: white;
            color: #10182f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
            font-weight: 900;
        }

        .brand-name {
            font-size: 21px;
            font-weight: 900;
        }

        .brand-subtitle {
            font-size: 11px;
            opacity: .55;
            margin-top: 3px;
        }

        .profile {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255,255,255,.10);
            border: 1px solid rgba(255,255,255,.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* ================= TABS ================= */

        .tabs {
            display: flex;
            gap: 8px;
            padding: 8px 16px 14px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            border: none;
            white-space: nowrap;
            padding: 10px 16px;
            border-radius: 12px;
            color: rgba(255,255,255,.65);
            background: rgba(255,255,255,.07);
            cursor: pointer;
            font-weight: 800;
        }

        .tab.active {
            background: white;
            color: #10182f;
        }

        /* ================= HERO ================= */

        .hero {
            margin: 0 16px 16px;
            padding: 18px;
            border-radius: 22px;
            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.14),
                    rgba(255,255,255,.05)
                );
            border: 1px solid rgba(255,255,255,.12);
            box-shadow: 0 18px 45px rgba(0,0,0,.25);
        }

        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .hero-title {
            font-size: 19px;
            font-weight: 900;
        }

        .live-dot {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 900;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4545;
            box-shadow: 0 0 12px #ff4545;
        }

        .hero-match {
            font-size: 17px;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .hero-info {
            font-size: 12px;
            opacity: .6;
        }

        .confidence {
            margin-top: 15px;
            padding: 12px;
            border-radius: 14px;
            background: rgba(0,0,0,.20);
        }

        .confidence-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 7px;
            font-size: 12px;
        }

        .confidence-value {
            font-weight: 900;
        }

        .progress {
            height: 7px;
            background: rgba(255,255,255,.10);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: white;
            border-radius: 10px;
            transition: width .4s ease;
        }

        /* ================= SECTION ================= */

        .section {
            padding: 0 16px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 10px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 900;
        }

        .see-all {
            border: none;
            background: none;
            color: rgba(255,255,255,.55);
            font-size: 12px;
            cursor: pointer;
        }

        /* ================= STATUS ================= */

        .status {
            text-align: center;
            padding: 18px;
            border-radius: 16px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.08);
            font-size: 13px;
            opacity: .7;
            margin-bottom: 12px;
        }

        .status.error {
            opacity: 1;
        }

        /* ================= LEAGUE ================= */

        .league {
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 18px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .league-header {
            padding: 13px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,.04);
        }

        .league-name {
            font-size: 13px;
            font-weight: 900;
        }

        .league-time {
            font-size: 10px;
            opacity: .5;
        }

        /* ================= MATCH ================= */

        .match {
            padding: 15px 14px;
            border-top: 1px solid rgba(255,255,255,.07);
        }

        .match-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 13px;
        }

        .match-time {
            font-size: 11px;
            opacity: .55;
        }

        .best-label {
            font-size: 9px;
            font-weight: 900;
            padding: 5px 8px;
            border-radius: 7px;
            background: rgba(255,255,255,.13);
        }

        .teams {
            display: grid;
            grid-template-columns: 1fr 40px 1fr;
            align-items: center;
            text-align: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .team {
            font-size: 14px;
            font-weight: 900;
        }

        .team-away {
            text-align: right;
        }

        .team-home {
            text-align: left;
        }

        .vs {
            font-size: 10px;
            opacity: .4;
        }

        /* ================= ODDS ================= */

        .odds {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 7px;
        }

        .odd {
            border: none;
            border-radius: 11px;
            padding: 11px 5px;
            background: rgba(255,255,255,.08);
            color: white;
            cursor: pointer;
            transition: .15s;
        }

        .odd:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,.15);
        }

        .odd-name {
            display: block;
            font-size: 10px;
            opacity: .55;
            margin-bottom: 4px;
        }

        .odd-value {
            font-size: 14px;
            font-weight: 900;
        }

        .odd.selected {
            background: white;
            color: #10182f;
        }

        /* ================= MARKETS ================= */

        .markets {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
            margin-top: 8px;
        }

        .market {
            padding: 10px;
            border-radius: 10px;
            background: rgba(255,255,255,.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
        }

        .market-value {
            font-weight: 900;
            font-size: 12px;
        }

        /* ================= LOADING ================= */

        .loading {
            padding: 25px;
            text-align: center;
            opacity: .65;
            font-size: 13px;
        }

        .spinner {
            width: 25px;
            height: 25px;
            border: 3px solid rgba(255,255,255,.15);
            border-top: 3px solid white;
            border-radius: 50%;
            margin: 0 auto 10px;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ================= BOTTOM NAV ================= */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 560px;
            padding: 9px 10px;
            background: rgba(8,12,25,.94);
            backdrop-filter: blur(18px);
            border-top: 1px solid rgba(255,255,255,.09);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            z-index: 20;
        }

        .nav-item {
            border: none;
            background: none;
            color: rgba(255,255,255,.45);
            padding: 7px 3px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 800;
        }

        .nav-icon {
            display: block;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .nav-item.active {
            color: white;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 380px) {

            body {
                padding-bottom: 80px;
            }

            .team {
                font-size: 12px;
            }

            .odd {
                padding: 9px 3px;
            }

            .odd-value {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="brand">

            <div class="brand-icon">
                ⚽
            </div>

            <div>

                <div class="brand-name">
                    BEST BET
                </div>

                <div class="brand-subtitle">
                    Football Odds & Predictions
                </div>

            </div>

        </div>

        <div class="profile">
            👤
        </div>

    </header>


    <!-- ================= TABS ================= -->

    <div class="tabs">

        <button
            class="tab active"
            onclick="selectTab(this, 'best')"
        >
            🎯 Best Bet
        </button>

        <button
            class="tab"
            onclick="selectTab(this, 'football')"
        >
            ⚽ Football
        </button>

        <button
            class="tab"
            onclick="selectTab(this, 'live')"
        >
            🔴 Live
        </button>

        <button
            class="tab"
            onclick="selectTab(this, 'today')"
        >
            📅 Today
        </button>

        <button
            class="tab"
            onclick="selectTab(this, 'leagues')"
        >
            🏆 Leagues
        </button>

    </div>


    <!-- ================= BEST BET HERO ================= -->

    <div class="hero">

        <div class="hero-top">

            <div class="hero-title">
                🎯 BEST BET
            </div>

            <div class="live-dot">
                <span class="dot"></span>
                ANALYSIS
            </div>

        </div>

        <div
            class="hero-match"
            id="heroMatch"
        >
            Waiting for API...
        </div>

        <div
            class="hero-info"
            id="heroInfo"
        >
            Football data connection
        </div>

        <div class="confidence">

            <div class="confidence-row">

                <span>
                    Best Bet Confidence
                </span>

                <span
                    class="confidence-value"
                    id="confidenceValue"
                >
                    0%
                </span>

            </div>

            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>

            </div>

        </div>

    </div>


    <!-- ================= MATCHES ================= -->

    <div class="section">

        <div class="section-header">

            <div class="section-title">
                ⚽ Today's Matches
            </div>

            <button
                class="see-all"
                onclick="loadMatches()"
            >
                Refresh
            </button>

        </div>


        <div
            id="loading"
            class="loading"
        >

            <div class="spinner"></div>

            Connecting to football API...

        </div>


        <div
            id="error"
            class="status error"
            style="display:none;"
        >
            ❌ Failed to load matches.
        </div>


        <div id="matchesContainer"></div>

    </div>


    <!-- ================= FOOTER ================= -->

    <div
        style="
            text-align:center;
            padding:20px 16px;
            opacity:.45;
            font-size:11px;
        "
    >
        ⚡ BEST BET · Football analysis dashboard
    </div>

</div>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

    <button
        class="nav-item active"
        onclick="selectNav(this)"
    >
        <span class="nav-icon">🏠</span>
        Home
    </button>

    <button
        class="nav-item"
        onclick="selectNav(this)"
    >
        <span class="nav-icon">⚽</span>
        Football
    </button>

    <button
        class="nav-item"
        onclick="selectNav(this)"
    >
        <span class="nav-icon">🎯</span>
        Best Bet
    </button>

    <button
        class="nav-item"
        onclick="selectNav(this)"
    >
        <span class="nav-icon">📜</span>
        History
    </button>

</nav>


<script>

    // =====================================================
    // API CONFIGURATION
    // =====================================================
    //
    // IMPORTANT:
    // Do NOT put your API-Football key here.
    //
    // This URL will point to our free backend/proxy.
    // Once the backend is ready, change ONLY this URL.
    //

    const API_BASE_URL =
        "https://YOUR-BACKEND-URL";


    // =====================================================
    // SELECT TAB
    // =====================================================

    function selectTab(button, type) {

        document
            .querySelectorAll(".tab")
            .forEach(tab => {

                tab.classList.remove("active");

            });

        button.classList.add("active");


        if (type === "best") {

            loadBestBet();

        }


        if (type === "football") {

            loadMatches();

        }


        if (type === "today") {

            loadMatches();

        }


        if (type === "live") {

            loadLive();

        }


        if (type === "leagues") {

            showLeagues();

        }

    }


    // =====================================================
    // SELECT ODDS
    // =====================================================

    function selectOdd(button) {

        const parent =
            button.parentElement;

        parent
            .querySelectorAll(".odd")
            .forEach(odd => {

                odd.classList.remove(
                    "selected"
                );

            });

        button.classList.add(
            "selected"
        );

    }


    // =====================================================
    // SELECT BOTTOM NAV
    // =====================================================

    function selectNav(button) {

        document
            .querySelectorAll(".nav-item")
            .forEach(nav => {

                nav.classList.remove(
                    "active"
                );

            });

        button.classList.add(
            "active"
        );

    }


    // =====================================================
    // CREATE MATCH HTML
    // =====================================================

    function createMatchHTML(match) {

        const odds =
            match.odds || {};

        const markets =
            match.markets || {};


        return `

            <div class="match">

                <div class="match-top">

                    <div class="match-time">
                        🕐 ${escapeHTML(
                            match.time || "--:--"
                        )}
                    </div>

                    <div class="best-label">
                        ${escapeHTML(
                            match.label ||
                            "⚽ MATCH"
                        )}
                    </div>

                </div>


                <div class="teams">

                    <div class="team team-home">
                        ${escapeHTML(
                            match.home ||
                            "Home"
                        )}
                    </div>

                    <div class="vs">
                        VS
                    </div>

                    <div class="team team-away">
                        ${escapeHTML(
                            match.away ||
                            "Away"
                        )}
                    </div>

                </div>


                <div class="odds">

                    <button
                        class="odd"
                        onclick="selectOdd(this)"
                    >

                        <span class="odd-name">
                            1
                        </span>

                        <span class="odd-value">
                            ${escapeHTML(
                                odds["1"] ||
                                "-"
                            )}
                        </span>

                    </button>


                    <button
                        class="odd"
                        onclick="selectOdd(this)"
                    >

                        <span class="odd-name">
                            X
                        </span>

                        <span class="odd-value">
                            ${escapeHTML(
                                odds["X"] ||
                                "-"
                            )}
                        </span>

                    </button>


                    <button
                        class="odd"
                        onclick="selectOdd(this)"
                    >

                        <span class="odd-name">
                            2
                        </span>

                        <span class="odd-value">
                            ${escapeHTML(
                                odds["2"] ||
                                "-"
                            )}
                        </span>

                    </button>

                </div>


                <div class="markets">

                    <div class="market">

                        <span>
                            Over 2.5
                        </span>

                        <span class="market-value">
                            ${escapeHTML(
                                markets[
                                    "Over 2.5"
                                ] ||
                                "-"
                            )}
                        </span>

                    </div>


                    <div class="market">

                        <span>
                            BTTS
                        </span>

                        <span class="market-value">
                            ${escapeHTML(
                                markets[
                                    "BTTS"
                                ] ||
                                "-"
                            )}
                        </span>

                    </div>

                </div>

            </div>

        `;

    }


    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // =====================================================
    // GROUP MATCHES BY LEAGUE
    // =====================================================

    function renderMatches(matches) {

        const container =
            document.getElementById(
                "matchesContainer"
            );


        if (
            !matches ||
            matches.length === 0
        ) {

            container.innerHTML = `

                <div class="status">

                    ⚽ No matches available.

                </div>

            `;

            return;

        }


        const leagues = {};


        matches.forEach(match => {

            const league =
                match.league ||
                "Other";


            if (!leagues[league]) {

                leagues[league] = [];

            }


            leagues[league].push(
                match
            );

        });


        let html = "";


        Object.keys(leagues).forEach(
            leagueName => {

                const leagueMatches =
                    leagues[
                        leagueName
                    ];


                const country =
                    leagueMatches[0]
                        .country ||
                    "";


                html += `

                    <div class="league">

                        <div class="league-header">

                            <div class="league-name">

                                🏆
                                ${escapeHTML(
                                    leagueName
                                )}

                            </div>

                            <div class="league-time">

                                ${escapeHTML(
                                    country
                                )}

                            </div>

                        </div>

                `;


                leagueMatches.forEach(
                    match => {

                        html +=
                            createMatchHTML(
                                match
                            );

                    }
                );


                html += `

                    </div>

                `;

            }
        );


        container.innerHTML =
            html;

    }


    // =====================================================
    // LOAD MATCHES
    // =====================================================

    async function loadMatches() {

        const loading =
            document.getElementById(
                "loading"
            );

        const error =
            document.getElementById(
                "error"
            );

        const container =
            document.getElementById(
                "matchesContainer"
            );


        loading.style.display =
            "block";

        error.style.display =
            "none";


        try {

            if (
                API_BASE_URL.includes(
                    "YOUR-BACKEND-URL"
                )
            ) {

                throw new Error(
                    "Backend URL is not configured yet."
                );

            }


            const response =
                await fetch(
                    `${API_BASE_URL}/api/matches`,
                    {
                        cache:
                            "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const data =
                await response.json();


            if (
                !data.success ||
                !Array.isArray(
                    data.matches
                )
            ) {

                throw new Error(
                    "Invalid API response"
                );

            }


            renderMatches(
                data.matches
            );


        } catch (err) {

            console.error(
                "Matches API error:",
                err
            );


            container.innerHTML = `

                <div class="status error">

                    ⚠️ Football API is not
                    connected yet.

                    <br><br>

                    Backend setup is required
                    before live matches can
                    appear.

                </div>

            `;

        } finally {

            loading.style.display =
                "none";

        }

    }


    // =====================================================
    // LOAD BEST BET
    // =====================================================

    async function loadBestBet() {

        try {

            if (
                API_BASE_URL.includes(
                    "YOUR-BACKEND-URL"
                )
            ) {

                throw new Error(
                    "Backend URL is not configured."
                );

            }


            const response =
                await fetch(
                    `${API_BASE_URL}/api/best-bet`,
                    {
                        cache:
                            "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const data =
                await response.json();


            if (
                !data.success ||
                !data.match
            ) {

                throw new Error(
                    "Invalid Best Bet response"
                );

            }


            const match =
                data.match;


            document.getElementById(
                "heroMatch"
            ).textContent =
                `${match.home} vs ${match.away}`;


            document.getElementById(
                "heroInfo"
            ).textContent =
                `${match.league || ""} · ${
                    match.time || ""
                }`;


            const confidence =
                Math.max(
                    0,
                    Math.min(
                        100,
                        Number(
                            match.confidence ||
                            0
                        )
                    )
                );


            document.getElementById(
                "confidenceValue"
            ).textContent =
                `${confidence}%`;


            document.getElementById(
                "progressBar"
            ).style.width =
                `${confidence}%`;


        } catch (err) {

            console.error(
                "Best Bet API error:",
                err
            );


            document.getElementById(
                "heroMatch"
            ).textContent =
                "Best Bet unavailable";


            document.getElementById(
                "heroInfo"
            ).textContent =
                "Backend API is not connected";


            document.getElementById(
                "confidenceValue"
            ).textContent =
                "0%";


            document.getElementById(
                "progressBar"
            ).style.width =
                "0%";

        }

    }


    // =====================================================
    // LIVE MATCHES
    // =====================================================

    async function loadLive() {

        const container =
            document.getElementById(
                "matchesContainer"
            );


        container.innerHTML = `

            <div class="loading">

                <div class="spinner"></div>

                Loading live matches...

            </div>

        `;


        try {

            if (
                API_BASE_URL.includes(
                    "YOUR-BACKEND-URL"
                )
            ) {

                throw new Error(
                    "Backend URL not configured."
                );

            }


            const response =
                await fetch(
                    `${API_BASE_URL}/api/live`,
                    {
                        cache:
                            "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const data =
                await response.json();


            if (
                !data.success ||
                !data.data ||
                !Array.isArray(
                    data.data.response
                )
            ) {

                throw new Error(
                    "Invalid live response"
                );

            }


            const live =
                data.data.response.map(
                    item => ({

                        home:
                            item.teams?.home
                                ?.name ||
                            "Home",

                        away:
                            item.teams?.away
                                ?.name ||
                            "Away",

                        league:
                            item.league
                                ?.name ||
                            "Live",

                        country:
                            item.league
                                ?.country ||
                            "",

                        time:
                            item.fixture
                                ?.status
                                ?.elapsed
                                ? `${
                                    item.fixture
                                        .status
                                        .elapsed
                                }'`
                                : "LIVE",

                        label:
                            "🔴 LIVE"

                    })
                );


            renderMatches(
                live
            );


        } catch (err) {

            console.error(
                "Live API error:",
                err
            );


            container.innerHTML = `

                <div class="status">

                    🔴 Live API is not
                    connected yet.

                </div>

            `;

        }

    }


    // =====================================================
    // LEAGUES
    // =====================================================

    function showLeagues() {

        document.getElementById(
            "matchesContainer"
        ).innerHTML = `

            <div class="status">

                🏆 Football Leagues

                <br><br>

                🏆 Premier League

                <br><br>

                🏆 La Liga

                <br><br>

                🏆 Serie A

                <br><br>

                🏆 Bundesliga

                <br><br>

                🏆 Champions League

                <br><br>

                🏆 Europa League

            </div>

        `;

    }


    // =====================================================
    // START
    // =====================================================

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            loadMatches();

            loadBestBet();

        }
    );


    // =====================================================
    // AUTO REFRESH
    // =====================================================

    setInterval(
        function () {

            loadMatches();

            loadBestBet();

        },
        60000
    );

</script>
