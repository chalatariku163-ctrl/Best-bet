<script>

"use strict";

/* =====================================================
STATE
===================================================== */

let matches = [];

let selectedDate = "all";

let betslip = [];


const area =
  document.getElementById(
    "matchesArea"
  );

const statusEl =
  document.getElementById(
    "status"
  );

const refreshBtn =

/* =====================================================
ESCAPE
===================================================== */

function esc(v){

  return String(
    v ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function js(v){

  return String(
    v ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /\n/g,
    "\\n"
  )
  .replace(
    /\r/g,
    "\\r"
  );

}


/* =====================================================
FETCH
===================================================== */

async function fetchJSON(
  url,
  timeout = 30000
){

  const controller =
    new AbortController();

  const timer =
    setTimeout(
      () => controller.abort(),
      timeout
    );

  try{

    const response =
      await fetch(
        url,
        {
          cache:
            "no-store",

          headers:{
            "Accept":
              "application/json"
          },

          signal:
            controller.signal
        }
      );


    const text =
      await response.text();

    let data;


    try{

      data =
        JSON.parse(
          text
        );

    }catch{

      throw new Error(
        "Server JSON osoo hin taane deebise. HTTP "
        + response.status
      );

    }


    if(
      !response.ok
    ){

      throw new Error(
        data.error
        ||
        data.message
        ||
        (
          "HTTP "
          + response.status
        )
      );

    }


    return data;


  }catch(error){

    if(
      error.name
      ===
      "AbortError"
    ){

      throw new Error(
        "Server yeroo dheeraa fudhate. Refresh irra deebi'ii yaali."
      );

    }

    throw error;


  }finally{

    clearTimeout(
      timer
    );

  }

}


/* =====================================================
STATUS
===================================================== */

function setStatus(
  text,
  error = false
){

  statusEl.textContent =
    "System: " + text;

  statusEl.className =
    "status"
    +
    (
      error
      ? " error"
      : ""
    );

}


/* =====================================================
DATE
===================================================== */

function dateKey(
  match
){

  if(
    !match
    ||
    !match.commence_time
  ){

    return "";

  }


  const date =
    new Date(
      match.commence_time
    );


  return new Intl.DateTimeFormat(
    "en-CA",
    {
      timeZone:
        "Africa/Addis_Ababa",

      year:
        "numeric",

      month:
        "2-digit",

      day:
        "2-digit"
    }
  ).format(
    date
  );

}


function fullDate(
  key
){

  if(!key)
    return "";


  return new Date(
    key
    + "T12:00:00"
  ).toLocaleDateString(
    "en-US",
    {
      weekday:
        "long",

      day:
        "2-digit",

      month:
        "long"
    }
  );

}


/* =====================================================
MARKET COUNT
===================================================== */

function marketCount(
  match
){

  const unique =
    new Set();


  (
    match.odds
    ||
    []
  ).forEach(
    odd => {

      const name =
        String(
          odd.market
          ||
          odd.market_description
          ||
          "Market"
        );

      unique.add(
        name
      );

    }
  );


  return Math.max(
    unique.size,
    1
  );

}


/* =====================================================
MAJOR LEAGUE
===================================================== */

function isMajorLeague(
  name
){

  const text =
    String(
      name || ""
    ).toLowerCase();


  const major = [

    "premier league",

    "english premier",

    "la liga",

    "laliga",

    "serie a",

    "bundesliga",

    "ligue 1",

    "champions league",

    "uefa champions",

    "europa league",

    "conference league",

    "fa cup",

    "copa del rey",

    "super cup",

    "world cup",

    "afc champions",

    "copa libertadores"

  ];


  return major.some(
    x => text.includes(x)
  );

}


/* =====================================================
ODD BUTTON
===================================================== */

function oddButton(
  odd,
  id,
  selection,
  market
){

  if(
    !Number.isFinite(
      Number(odd)
    )
  ){

    return `
      <button
        class="odd"
        disabled
      >
        —
      </button>
    `;

  }


  return `

    <button
      class="odd"
      type="button"
      onclick="
        addBet(
          '${js(id)}',
          '${js(selection)}',
          '${js(market)}',
          ${Number(odd)}
        )
      "
    >

      ${Number(
        odd
      ).toFixed(2)}

    </button>

  `;

}


/* =====================================================
CARD
===================================================== */

function card(
  match
){

  const h =
    match.h2h
    ||
    {};


  const one =
    h.home
    ? oddButton(
        h.home,
        match.id,
        "1",
        "1X2"
      )
    : `
      <button
        class="odd"
        disabled
      >
        —
      </button>
    `;


  const draw =
    h.draw
    ? oddButton(
        h.draw,
        match.id,
        "X",
        "1X2"
      )
    : `
      <button
        class="odd"
        disabled
      >
        —
      </button>
    `;


  const two =
    h.away
    ? oddButton(
        h.away,
        match.id,
        "2",
        "1X2"
      )
    : `
      <button
        class="odd"
        disabled
      >
        —
      </button>
    `;


  const leagueName =
    match.league
    ||
    "Football";


  return `

    <article
      class="match"
    >

      <div
        class="league-row"
      >

        <span
          class="${
            isMajorLeague(
              leagueName
            )
            ? "major"
            : ""
          }"
        >

          ⚽
          ${esc(
            leagueName
          )}

        </span>


        <span
          class="time"
        >

          ${esc(
            match.time
            ||
            ""
          )}

        </span>

      </div>


      <div
        class="teams-row"
      >

        <div
          class="team-names"
        >

          <div>
            ${esc(
              match.home
            )}
          </div>

          <div>
            ${esc(
              match.away
            )}
          </div>

        </div>


        ${one}

        ${draw}

        ${two}

      </div>


      ${
        match.odds_count
        ?
        `
          <div
            class="market-link"
            onclick="
              openMatch(
                '${js(match.id)}'
              )
            "
          >

            +${marketCount(
              match
            )} Markets

          </div>
        `
        :
        `
          <div
            class="noodds"
          >
            Odds yeroo ammaa hin jiru.
          </div>
        `
      }

    </article>

  `;

}


/* =====================================================
RENDER
===================================================== */

function render(){

  const list =
    matches.filter(
      match =>
        selectedDate === "all"
        ||
        dateKey(match)
        ===
        selectedDate
    );


  if(
    !list.length
  ){

    area.innerHTML = `

      <div class="empty">

        ⚽ Guyyaa kanaaf
        match hin jiru.

      </div>

    `;

    return;

  }


  const groups = {};


  list.forEach(
    match => {

      const key =
        dateKey(match);

      if(
        !groups[key]
      ){

        groups[key] = [];

      }

      groups[key].push(
        match
      );

    }
  );


  let html = "";


  Object.keys(
    groups
  )
  .sort()
  .forEach(
    day => {

      html += `

        <div
          class="day-title"
        >

          📅
          ${esc(
            fullDate(day)
          )}

          <small>
            ${groups[day].length}
            matches
          </small>

        </div>

      `;


      groups[day].forEach(
        match => {

          html += card(
            match
          );

        }
      );

    }
  );


  area.innerHTML =
    html;

}


/* =====================================================
LOAD
===================================================== */

async function load(
  force = false
){

  if(
    refreshBtn
  ){

    refreshBtn.disabled =
      true;

  }


  area.innerHTML = `

    <div class="loading">

      <div
        class="spinner"
      ></div>

      ⚽ Matches loading...

    </div>

  `;


  setStatus(
    "loading football matches..."
  );


  try{

    const url =
      force
      ? "/api/matches?refresh=1"
      : "/api/matches";


    const data =
      await fetchJSON(
        url,
        60000
      );


    if(
      !data.success
    ){

      throw new Error(
        data.error
        ||
        data.message
        ||
        "API error"
      );

    }


    matches =
      Array.isArray(
        data.matches
      )
      ? data.matches
      : [];


    if(
      !matches.length
    ){

      setStatus(
        "No football fixtures returned by SportMonks",
        true
      );


      area.innerHTML = `

        <div class="empty">

          ⚽
          Football fixtures
          hin argamne.

          <br><br>

          SportMonks API status:
          <b>
            ${esc(
              data.api_status
              ?? "-"
            )}
          </b>

          <br><br>

          ${esc(
            data.api_error
            ||
            "API key, subscription coverage fi date range ilaali."
          )}

          <br><br>

          <button
            class="filter"
            type="button"
            onclick="load(true)"
          >
            🔄 Try Again
          </button>

        </div>

      `;

      return;

    }


    const oddsCount =
      Number(
        data.odds_count
        || 0
      );


    setStatus(

      "Online • "
      +
      matches.length
      +
      " matches • "
      +
      oddsCount
      +
      " odds"

    );


    render();


  }catch(error){

    console.error(
      "LOAD ERROR:",
      error
    );


    setStatus(
      "API error",
      true
    );


    area.innerHTML = `

      <div class="error">

        <b>
          ⚠️ Matches loading failed
        </b>

        <br><br>

        ${esc(
          error.message
        )}

        <br><br>

        <button
          class="filter"
          type="button"
          onclick="load(true)"
        >
          🔄 Try Again
        </button>

      </div>

    `;


  }finally{

    if(
      refreshBtn
    ){

      refreshBtn.disabled =
        false;

    }

  }

}


/* =====================================================
OPEN MATCH
===================================================== */

async function openMatch(
  id
){

  const match =
    matches.find(
      item =>
        String(
          item.id
        )
        ===
        String(id)
    );


  if(!match)
    return;


  document
    .getElementById(
      "matchModal"
    )
    .classList.add(
      "show"
    );


  document
    .getElementById(
      "modalTitle"
    )
    .textContent =
      match.home
      +
      " vs "
      +
      match.away;


  document
    .getElementById(
      "modalContent"
    )
    .innerHTML = `

      <div class="loading">

        <div
          class="spinner"
        ></div>

        Markets loading...

      </div>

    `;


  try{

    const data =
      await fetchJSON(
        "/api/match/"
        +
        encodeURIComponent(
          id
        ),
        60000
      );


    if(
      !data.success
    ){

      throw new Error(
        data.error
        ||
        "Market API error"
      );

    }


    let html = "";


    if(
      data.best_bet
    ){

      html += `

        <div
          style="
            background:#dff7c0;
            border-radius:12px;
            padding:14px;
            margin-bottom:15px;
          "
        >

          <b>
            🎯 BEST BET
          </b>

          <br><br>

          ${esc(
            data.best_bet.selection
          )}

          —

          <b>
            ${Number(
              data.best_bet.odd
            ).toFixed(2)}
          </b>

          <br>

          <small>
            ${esc(
              data.best_bet.market
              || ""
            )}

            ${
              data.best_bet.bookmaker
              ? " • "
              +
              esc(
                data.best_bet.bookmaker
              )
              : ""
            }
          </small>

        </div>

      `;

    }


    (
      data.markets
      ||
      []
    ).forEach(
      market => {

        html += `

          <div
            class="market"
          >

            <div
              class="marketname"
            >

              ${esc(
                market.name
              )}

            </div>

            <div
              class="selectiongrid"
            >

        `;


        (
          market.selections
          ||
          []
        ).forEach(
          selection => {

            const odd =
              Number(
                selection.odd
              );


            if(
              !Number.isFinite(
                odd
              )
            ){

              return;

            }


            html += `

              <button
                class="selection"
                type="button"
                onclick="
                  addBet(
                    '${js(
                      match.id
                    )}',
                    '${js(
                      selection.value
                    )}',
                    '${js(
                      market.name
                    )}',
                    ${odd}
                  )
                "
              >

                ${esc(
                  selection.value
                )}

                <b>
                  ${odd.toFixed(2)}
                </b>

                ${
                  selection.bookmaker
                  ?
                  `
                    <small>
                      ${esc(
                        selection.bookmaker
                      )}
                    </small>
                  `
                  :
                  ""
                }

              </button>

            `;

          }
        );


        html += `

            </div>

          </div>

        `;

      }
    );


    document
      .getElementById(
        "modalContent"
      )
      .innerHTML =
        html
        ||
        `
          <div class="empty">
            Market hin argamne.
          </div>
        `;


  }catch(error){

    document
      .getElementById(
        "modalContent"
      )
      .innerHTML = `

        <div class="error">

          ⚠️
          ${esc(
            error.message
          )}

        </div>

      `;

  }

}


/* =====================================================
CLOSE MATCH
===================================================== */

function closeMatch(){

  document
    .getElementById(
      "matchModal"
    )
    .classList.remove(
      "show"
    );

}


function outsideMatch(
  event
){

  if(
    event.target.id
    ===
    "matchModal"
  ){

    closeMatch();

  }

}


/* =====================================================
ADD BET
===================================================== */

function addBet(
  id,
  selection,
  market,
  odd
){

  const match =
    matches.find(
      item =>
        String(
          item.id
        )
        ===
        String(id)
    );


  if(!match)
    return;


  // One selection per fixture.
  betslip =
    betslip.filter(
      item =>
        String(
          item.fixture_id
        )
        !==
        String(id)
    );


  betslip.push({

    fixture_id:
      id,

    home:
      match.home,

    away:
      match.away,

    league:
      match.league,

    market:
      market,

    selection:
      selection,

    odd:
      Number(odd)

  });


  localStorage.setItem(

    "bestbet_betslip",

    JSON.stringify(
      betslip
    )

  );


  updateSlip();

  closeMatch();

  openSlip();

}


/* =====================================================
UPDATE SLIP
===================================================== */

function updateSlip(){

  document
    .getElementById(
      "slipCount"
    )
    .textContent =
      betslip.length;


  document
    .getElementById(
      "navCount"
    )
    .textContent =
      betslip.length;


  let total = 1;


  betslip.forEach(
    item => {

      const odd =
        Number(
          item.odd
        );


      if(
        Number.isFinite(
          odd
        )
        &&
        odd > 1
      ){

        total *= odd;

      }

    }
  );


  document
    .getElementById(
      "slipOdds"
    )
    .textContent =
      total.toFixed(2);


  document
    .getElementById(
      "payout"
    )
    .textContent =
      total > 1
      ? (
          total * 100
        ).toFixed(2)
      : "0.00";

}


/* =====================================================
OPEN SLIP
===================================================== */

function openSlip(){

  renderSlip();

  document
    .getElementById(
      "slipModal"
    )
    .classList.add(
      "show"
    );

}


function closeSlip(){

  document
    .getElementById(
      "slipModal"
    )
    .classList.remove(
      "show"
    );

}


function outsideSlip(
  event
){

  if(
    event.target.id
    ===
    "slipModal"
  ){

    closeSlip();

  }

}


/* =====================================================
RENDER SLIP
===================================================== */

function renderSlip(){

  const container =
    document.getElementById(
      "slipContent"
    );


  if(
    !betslip.length
  ){

    container.innerHTML = `

      <div class="empty">

        🎟️ Bet Slip duwwaa dha.

        <br><br>

        Match keessaa odds filadhu.

      </div>

    `;

    return;

  }


  container.innerHTML =
    betslip.map(
      (
        item,
        index
      ) => `

        <div
          class="slipitem"
        >

          <b>
            ⚽
            ${esc(
              item.home
            )}
            vs
            ${esc(
              item.away
            )}
          </b>

          <br>

          <small>
            ${esc(
              item.league
            )}
          </small>

          <br><br>

          📊
          ${esc(
            item.market
          )}

          <br>

          🎯
          ${esc(
            item.selection
          )}

          —

          <b>
            ${Number(
              item.odd
            ).toFixed(2)}
          </b>

          <br>

          <button
            class="remove"
            type="button"
            onclick="
              removeBet(
                ${index}
              )
            "
          >
            🗑 Remove
          </button>

        </div>

      `
    )
    .join("");

}


/* =====================================================
REMOVE BET
===================================================== */

function removeBet(
  index
){

  betslip.splice(
    index,
    1
  );


  localStorage.setItem(

    "bestbet_betslip",

    JSON.stringify(
      betslip
    )

  );


  updateSlip();

  renderSlip();

  render();

}


/* =====================================================
LIVE
===================================================== */

    ){

      throw new Error(
        data.error
        ||

      );

    const live =

      ? data.matches
      : [];


    if(

    ){

      area.innerHTML = `

        <div class="empty">

          🔴 Yeroo ammaa

        </div>

      `;

    let html = "";

        html += `

            >

              <span>
                🔴
                ${esc(
                  match.league

                  "Football"

              class="team-names"

              <div>

                ${esc(

                  match.home_score

              </div>

                ${esc(
                  match.away
                )}

                —

                ${esc(
                  match.away_score
                  ??
                  "-"
                )}

              </div>

            </div>

        `;

      }
    );


    area.innerHTML =

    setStatus(
      "Live • "

  }catch(error){

    area.innerHTML = `

    setStatus(

/* =====================================================
DAY BUTTON
===================================================== */

if(
  todayBtn
){

  todayBtn.addEventListener(
    "click",
    () => {

      if(
        !matches.length
      )
        return;


      if(
        selectedDate
        ===
        "all"
      ){

        selectedDate =
          dateKey(
            matches[0]
          )
          ||
          "all";


        todayBtn.innerHTML =
          "First Day ▼";

      }else{

        selectedDate =
          "all";

        todayBtn.innerHTML =
          "All Days ▼";

      }


      render();

    }
  );

}


/* =====================================================
REFRESH
===================================================== */

if(
  refreshBtn
){

  refreshBtn.addEventListener(
    "click",
    () =>
      load(true)
  );

}


/* =====================================================
LOAD BETSLIP
===================================================== */

try{

  const saved =
    JSON.parse(
      localStorage.getItem(
        "bestbet_betslip"
      )
      ||
      "[]"
    );


  if(
    Array.isArray(
      saved
    )
  ){

    betslip =
      saved;

  }

}catch{

  betslip = [];

}


/* =====================================================
START
===================================================== */

updateSlip();

load(false);


/* =====================================================
AUTO REFRESH
===================================================== */

setInterval(
  () => {

    load(false);

  },
  300000
);

</script>
