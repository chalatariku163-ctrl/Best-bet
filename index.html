<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BEST BET - Football</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(
            circle at top,
            #263d70 0%,
            #10182f 40%,
            #070b16 100%
        );
    color:#fff;
    min-height:100vh;
    padding-bottom:90px;
}

button{
    font-family:inherit;
}

.app{
    width:100%;
    max-width:600px;
    margin:auto;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    padding:18px 16px 12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-icon{
    width:46px;
    height:46px;
    border-radius:14px;
    background:#fff;
    color:#10182f;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

.brand-name{
    font-size:21px;
    font-weight:900;
}

.brand-subtitle{
    font-size:10px;
    opacity:.55;
    margin-top:3px;
}

.profile{
    width:43px;
    height:43px;
    border-radius:50%;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.12);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

/* =====================================================
   TABS
===================================================== */

.tabs{
    display:flex;
    gap:8px;
    padding:8px 16px 15px;
    overflow-x:auto;
    scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
    display:none;
}

.tab{
    border:none;
    white-space:nowrap;
    padding:10px 15px;
    border-radius:12px;
    color:rgba(255,255,255,.65);
    background:rgba(255,255,255,.07);
    cursor:pointer;
    font-weight:800;
}

.tab.active{
    background:#fff;
    color:#10182f;
}

/* =====================================================
   HERO
===================================================== */

.hero{
    margin:0 16px 17px;
    padding:18px;
    border-radius:22px;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.15),
            rgba(255,255,255,.05)
        );
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 18px 45px rgba(0,0,0,.25);
}

.hero-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:13px;
}

.hero-title{
    font-size:19px;
    font-weight:900;
}

.live-dot{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:10px;
    font-weight:900;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#ff4545;
    box-shadow:0 0 12px #ff4545;
}

.hero-match{
    font-size:17px;
    font-weight:900;
    margin-bottom:6px;
}

.hero-info{
    font-size:11px;
    opacity:.6;
}

.confidence{
    margin-top:15px;
    padding:12px;
    border-radius:14px;
    background:rgba(0,0,0,.20);
}

.confidence-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:7px;
    font-size:12px;
}

.confidence-value{
    font-weight:900;
}

.progress{
    height:7px;
    background:rgba(255,255,255,.10);
    border-radius:10px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0;
    background:#fff;
    border-radius:10px;
    transition:.5s;
}

/* =====================================================
   SECTION
===================================================== */

.section{
    padding:0 16px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:20px 0 10px;
}

.section-title{
    font-size:17px;
    font-weight:900;
}

.refresh{
    border:none;
    background:rgba(255,255,255,.08);
    color:#fff;
    border-radius:9px;
    padding:7px 10px;
    cursor:pointer;
    font-size:11px;
}

/* =====================================================
   STATUS
===================================================== */

.status{
    text-align:center;
    padding:18px;
    border-radius:16px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    font-size:13px;
    opacity:.75;
    margin-bottom:12px;
}

/* =====================================================
   LOADING
===================================================== */

.loading{
    padding:25px;
    text-align:center;
    opacity:.7;
    font-size:13px;
}

.spinner{
    width:27px;
    height:27px;
    border:3px solid rgba(255,255,255,.15);
    border-top:3px solid white;
    border-radius:50%;
    margin:0 auto 10px;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =====================================================
   LEAGUE
===================================================== */

.league{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.09);
    border-radius:18px;
    margin-bottom:12px;
    overflow:hidden;
}

.league-header{
    padding:13px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,.04);
}

.league-name{
    font-size:13px;
    font-weight:900;
}

.league-country{
    font-size:10px;
    opacity:.5;
}

/* =====================================================
   MATCH
===================================================== */

.match{
    padding:15px 14px;
    border-top:1px solid rgba(255,255,255,.07);
}

.match-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:13px;
}

.match-time{
    font-size:10px;
    opacity:.55;
}

.best-label{
    font-size:9px;
    font-weight:900;
    padding:5px 8px;
    border-radius:7px;
    background:rgba(255,255,255,.13);
}

.teams{
    display:grid;
    grid-template-columns:1fr 45px 1fr;
    align-items:center;
    text-align:center;
    gap:8px;
    margin-bottom:14px;
}

.team{
    font-size:14px;
    font-weight:900;
}

.team-home{
    text-align:left;
}

.team-away{
    text-align:right;
}

.vs{
    font-size:10px;
    opacity:.4;
}

/* =====================================================
   PREDICTION TABLE
===================================================== */

.prediction-table{
    margin-top:10px;
    border-radius:13px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
}

.prediction-row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    background:rgba(255,255,255,.045);
}

.prediction-row + .prediction-row{
    border-top:1px solid rgba(255,255,255,.07);
}

.prediction-cell{
    padding:10px 6px;
    text-align:center;
    font-size:10px;
}

.prediction-head{
    font-weight:900;
    opacity:.55;
}

.prediction-value{
    font-size:13px;
    font-weight:900;
}

/* =====================================================
   ODDS
===================================================== */

.odds{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-top:9px;
}

.odd{
    border:none;
    border-radius:11px;
    padding:10px 5px;
    background:rgba(255,255,255,.08);
    color:#fff;
    cursor:pointer;
}

.odd:hover{
    background:rgba(255,255,255,.15);
}

.odd-name{
    display:block;
    font-size:10px;
    opacity:.55;
    margin-bottom:4px;
}

.odd-value{
    font-size:14px;
    font-weight:900;
}

.odd.selected{
    background:#fff;
    color:#10182f;
}

/* =====================================================
   MARKETS
===================================================== */

.markets{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:8px;
}

.market{
    padding:10px;
    border-radius:10px;
    background:rgba(255,255,255,.05);
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:10px;
}

.market-value{
    font-weight:900;
    font-size:12px;
}

/* =====================================================
   BALANCE CARD
===================================================== */

.balance-card{
    margin-top:12px;
    padding:18px;
    border-radius:18px;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.05)
        );
    border:1px solid rgba(255,255,255,.1);
}

.balance-label{
    font-size:11px;
    opacity:.55;
}

.balance-value{
    margin-top:6px;
    font-size:28px;
    font-weight:900;
}

.balance-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:14px;
}

.balance-button{
    border:none;
    padding:11px;
    border-radius:11px;
    cursor:pointer;
    font-weight:900;
    background:rgba(255,255,255,.10);
    color:#fff;
}

/* =====================================================
   PROFILE
===================================================== */

.profile-card{
    margin-top:12px;
    padding:18px;
    border-radius:18px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
}

.profile-avatar{
    width:65px;
    height:65px;
    border-radius:50%;
    background:#fff;
    color:#10182f;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    margin:0 auto 12px;
}

.profile-name{
    text-align:center;
    font-size:18px;
    font-weight:900;
}

.profile-line{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid rgba(255,255,255,.06);
    font-size:12px;
}

.profile-line:last-child{
    border-bottom:none;
}

/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:600px;
    padding:8px 10px;
    background:rgba(8,12,25,.95);
    backdrop-filter:blur(18px);
    border-top:1px solid rgba(255,255,255,.09);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    z-index:50;
}

.nav-item{
    border:none;
    background:none;
    color:rgba(255,255,255,.45);
    padding:7px 3px;
    cursor:pointer;
    font-size:10px;
    font-weight:800;
}

.nav-icon{
    display:block;
    font-size:18px;
    margin-bottom:4px;
}

.nav-item.active{
    color:#fff;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:380px){

    .team{
        font-size:12px;
    }

    .odd{
        padding:9px 3px;
    }

    .odd-value{
        font-size:13px;
    }
}

</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="brand">

        <div class="brand-icon">
            ⚽
        </div>

        <div>

            <div class="brand-name">
                BEST BET
            </div>

            <div class="brand-subtitle">
                Football Odds & Predictions
            </div>

        </div>

    </div>

    <div
        class="profile"
        onclick="showProfile()"
    >
        👤
    </div>

</header>


<!-- =====================================================
     TOP TABS
===================================================== -->

<div class="tabs">

    <button
        class="tab active"
        onclick="selectTab(this,'best')"
    >
        🎯 Best Bet
    </button>

    <button
        class="tab"
        onclick="selectTab(this,'football')"
    >
        ⚽ Football
    </button>

    <button
        class="tab"
        onclick="selectTab(this,'live')"
    >
        🔴 Live
    </button>

    <button
        class="tab"
        onclick="selectTab(this,'today')"
    >
        📅 Today
    </button>

    <button
        class="tab"
        onclick="selectTab(this,'leagues')"
    >
        🏆 Leagues
    </button>

</div>


<!-- =====================================================
     HERO BEST BET
===================================================== -->

<div class="hero">

    <div class="hero-top">

        <div class="hero-title">
            🎯 BEST BET
        </div>

        <div class="live-dot">
            <span class="dot"></span>
            ANALYSIS
        </div>

    </div>

    <div
        class="hero-match"
        id="heroMatch"
    >
        Loading...
    </div>

    <div
        class="hero-info"
        id="heroInfo"
    >
        Loading match data...
    </div>

    <div class="confidence">

        <div class="confidence-row">

            <span>
                Prediction Confidence
            </span>

            <span
                class="confidence-value"
                id="confidenceValue"
            >
                0%
            </span>

        </div>

        <div class="progress">

            <div
                class="progress-bar"
                id="progressBar"
            ></div>

        </div>

    </div>

</div>


<!-- =====================================================
     MAIN CONTENT
===================================================== -->

<div class="section">

    <div class="section-header">

        <div
            class="section-title"
            id="sectionTitle"
        >
            ⚽ Today's Matches
        </div>

        <button
            class="refresh"
            onclick="loadMatches()"
        >
            ↻ Refresh
        </button>

    </div>


    <div
        id="loading"
        class="loading"
    >

        <div class="spinner"></div>

        Loading matches...

    </div>


    <div
        id="error"
        class="status"
        style="display:none;"
    >
        ❌ Failed to load football data.
    </div>


    <div id="matchesContainer"></div>

</div>


<!-- =====================================================
     FOOTER
===================================================== -->

<div style="
    text-align:center;
    padding:22px 16px;
    opacity:.4;
    font-size:10px;
">

    ⚡ BEST BET · Football Analysis Dashboard

</div>

</div>


<!-- =====================================================
     BOTTOM NAV
===================================================== -->

<nav class="bottom-nav">

    <button
        class="nav-item active"
        onclick="homePage(this)"
    >

        <span class="nav-icon">
            🏠
        </span>

        Home

    </button>

    <button
        class="nav-item"
        onclick="footballPage(this)"
    >

        <span class="nav-icon">
            ⚽
        </span>

        Football

    </button>

    <button
        class="nav-item"
        onclick="bestPage(this)"
    >

        <span class="nav-icon">
            🎯
        </span>

        Best Bet

    </button>

    <button
        class="nav-item"
        onclick="profilePage(this)"
    >

        <span class="nav-icon">
            👤
        </span>

        Profile

    </button>

</nav>


<script>

/* =====================================================
   GLOBAL
===================================================== */

let allMatches = [];


/* =====================================================
   TAB
===================================================== */

function selectTab(button,type){

    document
        .querySelectorAll(".tab")
        .forEach(tab=>{
            tab.classList.remove("active");
        });

    button.classList.add("active");


    if(type === "best"){
        loadBestBet();
        loadMatches();
    }


    if(type === "football"){
        loadMatches();
    }


    if(type === "today"){
        loadMatches();
    }


    if(type === "live"){
        loadLive();
    }


    if(type === "leagues"){
        showLeagues();
    }
}


/* =====================================================
   ODDS SELECT
===================================================== */

function selectOdd(button){

    const parent =
        button.parentElement;

    parent
        .querySelectorAll(".odd")
        .forEach(item=>{
            item.classList.remove("selected");
        });

    button.classList.add("selected");
}


/* =====================================================
   MATCH HTML
===================================================== */

function createMatchHTML(match){

    const odds =
        match.odds || {};

    const markets =
        match.markets || {};

    return `

    <div class="match">

        <div class="match-top">

            <div class="match-time">
                🕐 ${match.time || "--:--"}
            </div>

            <div class="best-label">
                ${match.label || "⚽ MATCH"}
            </div>

        </div>


        <div class="teams">

            <div class="team team-home">
                ${match.home || "Home"}
            </div>

            <div class="vs">
                VS
            </div>

            <div class="team team-away">
                ${match.away || "Away"}
            </div>

        </div>


        <!-- BETIKA STYLE TABLE -->

        <div class="prediction-table">

            <div class="prediction-row">

                <div class="prediction-cell prediction-head">
                    1
                </div>

                <div class="prediction-cell prediction-head">
                    X
                </div>

                <div class="prediction-cell prediction-head">
                    2
                </div>

            </div>

            <div class="prediction-row">

                <div class="prediction-cell prediction-value">
                    ${odds["1"] || "-"}
                </div>

                <div class="prediction-cell prediction-value">
                    ${odds["X"] || "-"}
                </div>

                <div class="prediction-cell prediction-value">
                    ${odds["2"] || "-"}
                </div>

            </div>

        </div>


        <div class="odds">

            <button
                class="odd"
                onclick="selectOdd(this)"
            >

                <span class="odd-name">
                    HOME
                </span>

                <span class="odd-value">
                    ${odds["1"] || "-"}
                </span>

            </button>


            <button
                class="odd"
                onclick="selectOdd(this)"
            >

                <span class="odd-name">
                    DRAW
                </span>

                <span class="odd-value">
                    ${odds["X"] || "-"}
                </span>

            </button>


            <button
                class="odd"
                onclick="selectOdd(this)"
            >

                <span class="odd-name">
                    AWAY
                </span>

                <span class="odd-value">
                    ${odds["2"] || "-"}
                </span>

            </button>

        </div>


        <div class="markets">

            <div class="market">

                <span>
                    Over 2.5
                </span>

                <span class="market-value">
                    ${markets["Over 2.5"] || "-"}
                </span>

            </div>


            <div class="market">

                <span>
                    BTTS
                </span>

                <span class="market-value">
                    ${markets["BTTS"] || "-"}
                </span>

            </div>

        </div>

    </div>

    `;
}


/* =====================================================
   RENDER MATCHES
===================================================== */

function renderMatches(matches){

    const container =
        document.getElementById(
            "matchesContainer"
        );

    if(!matches || matches.length === 0){

        container.innerHTML = `

            <div class="status">

                ⚽ No matches available.

            </div>

        `;

        return;
    }


    const leagues = {};


    matches.forEach(match=>{

        const league =
            match.league || "Other";

        if(!leagues[league]){
            leagues[league] = [];
        }

        leagues[league].push(match);

    });


    let html = "";


    Object.keys(leagues)
        .forEach(leagueName=>{

            const list =
                leagues[leagueName];

            const country =
                list[0].country || "";


            html += `

            <div class="league">

                <div class="league-header">

                    <div class="league-name">
                        🏆 ${leagueName}
                    </div>

                    <div class="league-country">
                        ${country}
                    </div>

                </div>

            `;


            list.forEach(match=>{

                html +=
                    createMatchHTML(match);

            });


            html += `

            </div>

            `;

        });


    container.innerHTML = html;
}


/* =====================================================
   LOAD MATCHES
===================================================== */

async function loadMatches(){

    const loading =
        document.getElementById(
            "loading"
        );

    const error =
        document.getElementById(
            "error"
        );

    const container =
        document.getElementById(
            "matchesContainer"
        );


    loading.style.display =
        "block";

    error.style.display =
        "none";


    try{

        const response =
            await fetch(
                "/api/matches",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(
            !data.success ||
            !Array.isArray(
                data.matches
            )
        ){

            throw new Error(
                "Invalid response"
            );

        }


        allMatches =
            data.matches;


        renderMatches(
            allMatches
        );


    }catch(errorObject){

        console.error(
            errorObject
        );

        container.innerHTML = "";

        error.style.display =
            "block";


    }finally{

        loading.style.display =
            "none";

    }
}


/* =====================================================
   LOAD BEST BET
===================================================== */

async function loadBestBet(){

    try{

        const response =
            await fetch(
                "/api/best-bet",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(
            !data.success ||
            !data.match
        ){

            throw new Error(
                "Best Bet unavailable"
            );

        }


        const match =
            data.match;


        document
            .getElementById(
                "heroMatch"
            )
            .textContent =
            `${match.home} vs ${match.away}`;


        document
            .getElementById(
                "heroInfo"
            )
            .textContent =
            `${match.league} · ${match.time}`;


        const confidence =
            Number(
                match.confidence || 0
            );


        document
            .getElementById(
                "confidenceValue"
            )
            .textContent =
            confidence + "%";


        document
            .getElementById(
                "progressBar"
            )
            .style.width =
            confidence + "%";


    }catch(error){

        console.error(
            "Best Bet error:",
            error
        );


        document
            .getElementById(
                "heroMatch"
            )
            .textContent =
            "Best Bet unavailable";


        document
            .getElementById(
                "heroInfo"
            )
            .textContent =
            "Football API data unavailable";


        document
            .getElementById(
                "confidenceValue"
            )
            .textContent =
            "0%";


        document
            .getElementById(
                "progressBar"
            )
            .style.width =
            "0%";
    }
}


/* =====================================================
   LIVE
===================================================== */

function loadLive(){

    document
        .getElementById(
            "sectionTitle"
        )
        .textContent =
        "🔴 Live Football";


    document
        .getElementById(
            "matchesContainer"
        )
        .innerHTML = `

        <div class="status">

            🔴 Live football endpoint
            <br><br>

/* =====================================================
   NAV ACTIVE
===================================================== */

function setNav(button){

    document
        .querySelectorAll(
            ".nav-item"
        )
        .forEach(item=>{
            item.classList.remove(
                "active"
            );
        });

    button.classList.add(
        "active"
    );
}
