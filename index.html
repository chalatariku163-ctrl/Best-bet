<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BEST BET - Football</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#101a28;
    color:#fff;
    min-height:100vh;
    padding-bottom:85px;
}

button{
    font-family:inherit;
}

.app{
    width:100%;
    max-width:700px;
    margin:auto;
}

/* ================= HEADER ================= */

.header{
    height:72px;
    padding:10px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#121f2e;
}

.menu{
    font-size:30px;
    color:#cbd2d9;
    cursor:pointer;
}

.brand{
    display:flex;
    align-items:center;
    gap:8px;
}

.brand-icon{
    width:42px;
    height:42px;
    border-radius:8px;
    background:#fff;
    color:#162438;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
}

.brand-name{
    color:#ffd900;
    font-size:21px;
    font-weight:900;
}

.brand-subtitle{
    color:#5f80a0;
    font-size:8px;
}

.profile{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#253545;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    cursor:pointer;
}

/* ================= SPORTS ================= */

.sports{
    display:flex;
    overflow-x:auto;
    background:#152334;
    scrollbar-width:none;
}

.sports::-webkit-scrollbar{
    display:none;
}

.sport{
    min-width:105px;
    padding:13px 8px 12px;
    text-align:center;
    color:#8d99a7;
    border:none;
    background:none;
    cursor:pointer;
    font-size:13px;
}

.sport-icon{
    display:block;
    font-size:28px;
    margin-bottom:5px;
}

.sport.active{
    color:#fff;
    background:#1b2a3b;
    font-weight:900;
}

/* ================= FOOTBALL NAV ================= */

.football-nav{
    display:flex;
    gap:28px;
    padding:18px 18px 10px;
    background:#101a28;
    overflow-x:auto;
    scrollbar-width:none;
}

.football-nav::-webkit-scrollbar{
    display:none;
}

.football-tab{
    border:none;
    background:none;
    color:#aeb7c2;
    white-space:nowrap;
    font-size:15px;
    font-weight:700;
    padding-bottom:9px;
    cursor:pointer;
}

.football-tab.active{
    color:#fff;
    border-bottom:3px solid #ffd600;
}

/* ================= FILTERS ================= */

.filters{
    display:flex;
    gap:9px;
    padding:8px 15px 17px;
    overflow-x:auto;
    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter{
    border:none;
    background:#223342;
    color:#fff;
    padding:11px 16px;
    border-radius:22px;
    white-space:nowrap;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
}

.filter.active{
    background:#273a4b;
}

/* ================= BANNER ================= */

.banner{
    margin:0 15px 18px;
    min-height:105px;
    border-radius:5px;
    padding:16px;
    background:
        linear-gradient(
            110deg,
            #d8ed18,
            #8fd329,
            #d5ef17
        );
    color:#15321d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    overflow:hidden;
}

.banner-text{
    max-width:65%;
}

.banner-small{
    font-size:11px;
    font-weight:900;
}

.banner-title{
    font-size:24px;
    font-weight:1000;
    margin-top:5px;
}

.banner-right{
    font-size:35px;
}

/* ================= SECTION ================= */

.section{
    padding:0 15px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:4px 3px 10px;
}

.section-title{
    font-size:17px;
    font-weight:900;
}

.refresh{
    border:none;
    background:#243545;
    color:#fff;
    padding:8px 11px;
    border-radius:10px;
    cursor:pointer;
}

/* ================= TABLE HEADER ================= */

.odds-header{
    display:grid;
    grid-template-columns:1fr 65px 65px 65px;
    align-items:center;
    padding:5px 12px 8px;
    color:#aeb8c3;
    font-size:13px;
    font-weight:800;
}

.odds-header div:not(:first-child){
    text-align:center;
}

/* ================= LEAGUE ================= */

.league{
    margin-bottom:11px;
    background:#152332;
    border-radius:10px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.025);
}

.league-header{
    padding:13px 13px 10px;
    color:#aeb8c3;
    font-size:12px;
    border-bottom:1px solid rgba(255,255,255,.05);
    display:flex;
    justify-content:space-between;
}

.league-name{
    font-weight:800;
}

.league-country{
    opacity:.65;
}

/* ================= MATCH ================= */

.match{
    padding:15px 12px 16px;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.match:last-child{
    border-bottom:none;
}

.match-info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.match-time{
    color:#aab5c1;
    font-size:12px;
}

.match-label{
    color:#8fa0b0;
    font-size:10px;
}

.match-row{
    display:grid;
    grid-template-columns:1fr 65px 65px 65px;
    align-items:center;
    gap:4px;
}

.teams{
    min-width:0;
}

.team{
    font-size:15px;
    font-weight:800;
    line-height:1.55;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.odd{
    height:49px;
    border:none;
    border-radius:24px;
    background:#203342;
    color:#fff;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
}

.odd:hover{
    background:#2b4355;
}

.odd.selected{
    background:#ffd600;
    color:#111;
}

.markets-count{
    text-align:right;
    color:#75b82d;
    font-size:13px;
    font-weight:900;
    margin-top:10px;
    cursor:pointer;
}

/* ================= STATUS ================= */

.status{
    text-align:center;
    padding:22px;
    border-radius:12px;
    background:#192837;
    color:#aeb9c5;
    margin-bottom:12px;
    font-size:13px;
}

.loading{
    text-align:center;
    padding:30px;
    color:#aab5c1;
}

.spinner{
    width:28px;
    height:28px;
    border:3px solid #304354;
    border-top-color:#ffd600;
    border-radius:50%;
    margin:0 auto 10px;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* ================= BEST BET ================= */

.best-card{
    margin:0 15px 16px;
    padding:16px;
    border-radius:13px;
    background:#1a2b3b;
    border:1px solid rgba(255,255,255,.06);
}

.best-title{
    color:#ffd600;
    font-weight:900;
    margin-bottom:9px;
}

.best-match{
    font-size:17px;
    font-weight:900;
}

.best-info{
    color:#8f9dac;
    font-size:11px;
    margin-top:5px;
}

.confidence{
    margin-top:13px;
}

.confidence-row{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:#aab5c1;
    margin-bottom:6px;
}

.progress{
    height:6px;
    background:#26394a;
    border-radius:10px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0;
    background:#ffd600;
}

/* ================= PROFILE ================= */

.profile-card{
    margin-top:12px;
    background:#172736;
    border-radius:15px;
    padding:20px;
}

.profile-avatar{
    width:65px;
    height:65px;
    margin:auto;
    border-radius:50%;
    background:#263b4c;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
}

.profile-name{
    text-align:center;
    font-weight:900;
    font-size:18px;
    margin:12px 0;
}

.profile-line{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid rgba(255,255,255,.06);
    font-size:13px;
    color:#b5c0cb;
}

.balance-card{
    margin-top:12px;
    background:#1c2e3e;
    padding:18px;
    border-radius:15px;
}

.balance-label{
    color:#8293a3;
    font-size:11px;
}

.balance-value{
    font-size:27px;
    font-weight:900;
    margin-top:5px;
}

.balance-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:15px;
}

.balance-button{
    border:none;
    padding:12px;
    border-radius:10px;
    background:#263b4b;
    color:#fff;
    font-weight:900;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;
    z-index:100;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:700px;
    height:75px;
    background:#142131;
    border-top:1px solid rgba(255,255,255,.07);
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.nav-item{
    border:none;
    background:none;
    color:#8995a2;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
}

.nav-icon{
    display:block;
    font-size:23px;
    margin-bottom:3px;
}

.nav-item.active{
    color:#ffd600;
}

/* ================= RESPONSIVE ================= */

@media(max-width:390px){

    .match-row,
    .odds-header{
        grid-template-columns:1fr 58px 58px 58px;
    }

    .odd{
        height:45px;
        font-size:13px;
    }

    .team{
        font-size:13px;
    }

    .banner-title{
        font-size:20px;
    }

}

</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<header class="header">

        onclick="homePage(this)"

        onclick="footballPage(this)"

        Football

<script>

let allMatches = [];


/* =====================================================
   FOOTBALL SECTION
===================================================== */

function footballSection(button,type){

    document
        .querySelectorAll(".football-tab")
        .forEach(item=>{
            item.classList.remove("active");
        });

    button.classList.add("active");

    if(type === "highlights"){
        document.getElementById("sectionTitle").textContent =
            "Highlights";
        loadMatches();
    }

    if(type === "upcoming"){
        document.getElementById("sectionTitle").textContent =
            "Upcoming Matches";
        loadMatches();
    }

    if(type === "countries"){
        showCountries();
    }

    if(type === "zoom"){
        document.getElementById("sectionTitle").textContent =
            "Zoom Soccer";
        loadMatches();
    }
}


/* =====================================================
   CREATE MATCH
===================================================== */

function createMatchHTML(match){

    const odds = match.odds || {};

    return `

        <div class="match">

            <div class="match-info">

                <div class="match-time">
                    🕐 ${match.time || "--:--"}
                </div>

                <div class="match-label">
                    ${match.label || "Football"}
                </div>

            </div>


            <div class="match-row">

                <div class="teams">

                    <div class="team">
                        ${match.home || "Home"}
                    </div>

                    <div class="team">
                        ${match.away || "Away"}
                    </div>

                </div>


                <button
                    class="odd"
                    onclick="selectOdd(this)"
                >
                    ${odds["1"] || "-"}
                </button>


                <button
                    class="odd"
                    onclick="selectOdd(this)"
                >
                    ${odds["X"] || "-"}
                </button>


                <button
                    class="odd"
                    onclick="selectOdd(this)"
                >
                    ${odds["2"] || "-"}
                </button>

            </div>


            <div
                class="markets-count"
                onclick="openMarkets('${match.home || ""}','${match.away || ""}')"
            >
                +${match.market_count || 42} Markets
            </div>

        </div>

    `;
}


/* =====================================================
   RENDER
===================================================== */

function renderMatches(matches){

    const container =
        document.getElementById("matchesContainer");

    if(!matches || matches.length === 0){

        container.innerHTML = `

            <div class="status">

                ⚽ No matches available.

                <br><br>

                Please check your Football API.

            </div>

        `;

        return;
    }


    const leagues = {};


    matches.forEach(match=>{

        const league =
            match.league || "International Clubs";

        if(!leagues[league]){
            leagues[league] = [];
        }

        leagues[league].push(match);

    });


    let html = "";


    Object.keys(leagues).forEach(leagueName=>{

        const list =
            leagues[leagueName];

        const country =
            list[0].country || "International";


        html += `

            <div class="league">

                <div class="league-header">

                    <div class="league-name">
                        ⚽ ${leagueName}
                    </div>

                    <div class="league-country">
                        ${country}
                    </div>

                </div>

        `;


        list.forEach(match=>{

            html += createMatchHTML(match);

        });


        html += `

            </div>

        `;

    });


    container.innerHTML = html;
}


/* =====================================================
   SELECT ODDS
===================================================== */

function selectOdd(button){

    const row =
        button.parentElement;

    row
        .querySelectorAll(".odd")
        .forEach(item=>{
            item.classList.remove("selected");
        });

    button.classList.add("selected");
}


/* =====================================================
   LOAD MATCHES
===================================================== */

async function loadMatches(){

    const loading =
        document.getElementById("loading");

    const error =
        document.getElementById("error");

    const container =
        document.getElementById("matchesContainer");


    loading.style.display = "block";

    error.style.display = "none";


    try{

        const response =
            await fetch(
                "/api/matches",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        if(
            !data.success ||
            !Array.isArray(data.matches)
        ){

            throw new Error(
                "Invalid API response"
            );

        }


        allMatches =
            data.matches;


        renderMatches(
            allMatches
        );


    }catch(err){

        console.error(err);

        container.innerHTML = "";

        error.style.display = "block";

    }finally{

        loading.style.display = "none";

    }
}


/* =====================================================
   BEST BET
===================================================== */

async function loadBestBet(){

    try{

        const response =
            await fetch(
                "/api/best-bet",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Best Bet unavailable"
            );

        }


        const data =
            await response.json();


        if(
            !data.success ||
            !data.match
        ){

            throw new Error(
                "No Best Bet"
            );

        }


        const match =
            data.match;


        document.getElementById(
            "heroMatch"
        ).textContent =
            `${match.home} vs ${match.away}`;


        document.getElementById(
            "heroInfo"
        ).textContent =
            `${match.league || "Football"} · ${match.time || ""}`;


        const confidence =
            Number(match.confidence || 0);


        document.getElementById(
            "confidenceValue"
        ).textContent =
            confidence + "%";


        document.getElementById(
            "progressBar"
        ).style.width =
            confidence + "%";


    }catch(err){

        console.log(err);

        document.getElementById(
            "heroMatch"
        ).textContent =
            "Best Bet unavailable";

        document.getElementById(
            "heroInfo"
        ).textContent =
            "Football API data unavailable";

    }
}


/* =====================================================
   COUNTRIES
===================================================== */

function showCountries(){

    document.getElementById(
        "sectionTitle"
    ).textContent =
        "Countries";


    document.getElementById(
        "matchesContainer"
    ).innerHTML = `

        <div class="league">

            <div class="league-header">
                <div class="league-name">
                    🏴 England
                </div>
                <div>Premier League</div>
            </div>

        </div>


        <div class="league">

            <div class="league-header">
                <div class="league-name">
                    🇪🇸 Spain
                </div>
                <div>La Liga</div>
            </div>

        </div>


        <div class="league">

            <div class="league-header">
                <div class="league-name">
                    🇮🇹 Italy
                </div>
                <div>Serie A</div>
            </div>

        </div>


        <div class="league">

            <div class="league-header">
                <div class="league-name">
                    🇩🇪 Germany
                </div>
                <div>Bundesliga</div>
            </div>

        </div>


        <div class="league">

            <div class="league-header">
                <div class="league-name">
                    🇫🇷 France
                </div>
                <div>Ligue 1</div>
            </div>

        </div>

    `;
}


/* =====================================================
   MARKETS
===================================================== */

function openMarkets(home,away){

    alert(
        "More markets for " +
        home +
        " vs " +
        away +
        " will be connected to your API."
    );

}


/* =====================================================
